spring.application.name=banktdea

# Default active profile (dev uses in-memory H2 with PostgreSQL compatibility mode)
spring.profiles.active=dev

# Server Port (running on 8081 so it does not conflict with 8080)
server.port=8081

# PostgreSQL datasource (production profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/banktdea
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

