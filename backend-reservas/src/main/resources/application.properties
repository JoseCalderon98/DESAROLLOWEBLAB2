spring.application.name=apptdea

# Default active profile (dev uses in-memory H2 with PostgreSQL syntax, prod uses physical PostgreSQL)
spring.profiles.active=dev

# Server Port
server.port=8080

# PostgreSQL datasource (production / default profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/reservationtdea
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI documentation path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
